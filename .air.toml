# Live reload for local development: `make dev`.
# Expects Postgres to be reachable on the host (`make db-up`).

root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/server ./cmd/server"
  bin = "./tmp/server"
  include_ext = ["go", "sql"]
  exclude_dir = ["tmp", "bin", ".git", "migrations"]
  exclude_regex = ["_test\\.go"]
  # Editors write files in bursts; wait for the dust to settle before rebuilding.
  delay = 300
  stop_on_error = true

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = true
