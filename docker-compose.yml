services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xox}
      POSTGRES_DB: ${POSTGRES_DB:-xox}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-xox} -d ${POSTGRES_DB:-xox}",
        ]
      interval: 2s
      timeout: 3s
      retries: 15

  server:
    build: .
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://${POSTGRES_USER:-xox}:${POSTGRES_PASSWORD:-xox}@postgres:5432/${POSTGRES_DB:-xox}?sslmode=disable"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set — copy .env.example to .env}
      JWT_TTL: ${JWT_TTL:-30m}
    ports:
      - "${HTTP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
